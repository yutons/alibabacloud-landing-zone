name: Sync fork with upstream
on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时同步一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master
        run: |
          git remote add upstream https://github.com/aliyun/alibabacloud-landing-zone.git
          git fetch upstream '+refs/heads/master:refs/remotes/upstream/master'
          git merge --no-edit upstream/master
          git push origin master

      - name: Mirror master to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git remote add gitee "https://yutons:${GITEE_TOKEN}@gitee.com/newcapec_nc/alibabacloud-landing-zone.git"
          git push gitee '+refs/heads/master:refs/heads/master'
